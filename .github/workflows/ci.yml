name: CI

# tags-ignore, não branches: o push de uma tag disparava CI e Release ao mesmo
# tempo — dois publishes self-contained de ~190 MB concorrendo —, e tag é
# assunto do release.yml. Push em branch continua rodando o CI normalmente.
on:
  push:
    tags-ignore: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # Job separado: o .msi publica os dois .exe self-contained (~190 MB) e leva
  # minutos. O installer/ está fora da PrintAgent.slnx justamente para não
  # pesar no build+test, mas quebra de .wxs precisa aparecer no CI.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # O wixproj restaura Host e Tray por conta própria (RestoreAgentBinaries),
      # mas restaurar a .slnx aqui deixa o cache de pacotes quente e cobre o
      # caso de alguém rodar o job com SkipAgentPublish.
      - name: Restore
        run: dotnet restore

      - name: Build .msi
        run: dotnet build installer/PrintAgent.Installer.wixproj --configuration Release
